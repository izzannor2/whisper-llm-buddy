<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalDev AI - Loading</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      background: #0a0e14;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container { text-align: center; max-width: 420px; padding: 2rem; }
    .logo { font-size: 2.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; color: #00d4aa; }
    .subtitle { color: #666; font-size: 0.875rem; margin-bottom: 2rem; }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: #1a1f2e;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d4aa, #0088ff);
      border-radius: 2px;
      animation: loading 2s ease-in-out infinite;
      width: 40%;
    }
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    .status {
      font-size: 0.75rem;
      color: #555;
      font-family: monospace;
    }
    .status span { color: #00d4aa; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🤖</div>
    <h1>LocalDev AI</h1>
    <p class="subtitle">AI-Powered Development Environment</p>
    <div class="progress-bar"><div class="progress-fill"></div></div>
    <p class="status"><span>►</span> Starting development server...</p>
  </div>
</body>
</html>
